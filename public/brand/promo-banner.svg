  <text x="120" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="-0.04em" fill="#FFFFFF">BUILT TO MOVE.</text>
  <text x="120" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#A1A1AA" max-width="600">Performance technology meets everyday design. Precision-engineered foam cushioning.</text>

